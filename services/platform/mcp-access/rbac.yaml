apiVersion: v1
kind: Namespace
metadata:
  name: mcp-access
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-mcp-readonly
  namespace: mcp-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-mcp-readonly
rules:
  # Kubernetes RBAC is additive and cannot express "all resources except
  # Secrets". Keep the core API explicit so credential-bearing Secret objects
  # and active access subresources such as exec, attach, port-forward, and
  # proxy remain unavailable.
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/status
      - nodes
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - pods
      - pods/log
      - pods/status
      - podtemplates
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - serviceaccounts
      - services
      - services/status
    verbs: ["get", "list", "watch"]

  # Standard Kubernetes APIs do not carry Secret payloads. Wildcard resources
  # also cover their read-only status and scale subresources as APIs evolve.
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - gateway.networking.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - snapshot.storage.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list"]

  # Read-only operator APIs whose objects contain operational configuration or
  # references to Secrets, but never Secret payloads themselves. New operator
  # API groups remain default-denied until they are classified here.
  - apiGroups:
      - argoproj.io
      - externaldns.k8s.io
      - monitoring.grafana.com
      - postgresql.cnpg.io
      - traefik.io
      - volsync.backube
      - zfs.openebs.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Certificate objects can contain literal keystore passwords, so only the
  # non-payload cert-manager resources are readable. ACME Challenge and Order
  # objects are omitted because they expose live challenge tokens.
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificaterequests
      - clusterissuers
      - issuers
    verbs: ["get", "list", "watch"]

  # Prometheus, PrometheusAgent, and ThanosRuler objects are omitted because
  # their deprecated bearerToken fields can contain credentials in clear text.
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagerconfigs
      - alertmanagers
      - podmonitors
      - probes
      - prometheusrules
      - scrapeconfigs
      - servicemonitors
    verbs: ["get", "list", "watch"]

  # Traefik Hub authentication policies are intentionally omitted:
  # accesscontrolpolicies can store JWT signing material directly, while
  # apiauths and apiportalauths are credential-oriented resources.
  - apiGroups: ["hub.traefik.io"]
    resources:
      - aiservices
      - apibundles
      - apicatalogitems
      - apiplans
      - apiportals
      - apiratelimits
      - apis
      - apiversions
      - managedapplications
      - managedsubscriptions
    verbs: ["get", "list", "watch"]

  # external-secrets.io and generators.external-secrets.io are intentionally
  # omitted because those APIs exist specifically to locate, generate, and
  # distribute credential material.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: codex-mcp-readonly
    namespace: mcp-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codex-mcp-readonly
