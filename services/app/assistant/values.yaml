namespace: assistant

labels:
  d-reis.com/context: ai
annotations:
  d-reis.com/context: ai

deployment:
  rolloutTriggers:
    config:
      kind: ConfigMap
      name: assistant-config

image:
  repository: ghcr.io/pikaro/ai-assistant
  tag: sha-68ec995

additionalResources:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: assistant-config
    data:
      config.yaml: |
        model_id: qwen3-4b-instruct
        multi_voice:
          default_character: assistant
          characters:
            assistant:
              voice: attenborough
              marker: "§"
              description: "The default assistant voice."
            narrator:
              voice: attenborough
              marker: "𝄞"
              description: "David Attenborough voice for a calm and informative tone."
            pikaro:
              voice: bender
              marker: "⊙"
              description: "An irreverent and humorous robot voice."
            hal:
              voice: hal
              marker: "☐"
              description: "HAL 9000 voice for a calm and slightly ominous tone."
            morgan:
              voice: morgan
              marker: "•"
              description: "Morgan Freeman voice for a calm and authoritative tone."
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: canonical-host
    spec:
      headers:
        customRequestHeaders:
          Host: hal.d-reis.com
          X-Forwarded-Host: hal.d-reis.com

additionalVolumes:
  - name: config
    configMap:
      name: assistant-config
      items:
        - key: config.yaml
          path: config.yaml

container:
  env:
    ASSISTANT_CONFIG_FILE: /config.yaml
    LOG_LEVEL: INFO
    ASSISTANT_SAVE_LATEST_WAV: "false"
  volumeMounts:
    - name: config
      mountPath: /config.yaml
      subPath: config.yaml
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  startupProbe:
    enabled: true

service:
  port: 80

serviceMonitor:
  enabled: true

ingress:
  enabled: true
  host: hal.d-reis.com
  tls:
    secretName: assistant-tls
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hal.d-reis.com
    external-dns.alpha.kubernetes.io/target: thule.d-reis.com
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: assistant-canonical-host@kubernetescrd,traefik-forward-auth@kubernetescrd
  authentikOutpost:
    enabled: true

networkPolicy:
  ingressNamespaces:
    - monitoring
    - traefik
